<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订阅 · Fan Wan</title>
  <meta http-equiv="refresh" content="0; url=contact.html#connect-subscribe">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://fanwan-ai.github.io/contact.html#connect-subscribe">
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){
      try {
        const stored = localStorage.getItem('lang');
        const doc = document.documentElement;
        const lang = (stored || doc.lang || 'zh').toLowerCase().slice(0,2);
        doc.setAttribute('lang', lang === 'en' || lang === 'es' ? lang : 'zh');
        const base = 'contact.html';
        const target = lang === 'en' ? `${base}?lang=en#connect-subscribe` : lang === 'es' ? `${base}?lang=es#connect-subscribe` : `${base}#connect-subscribe`;
        window.location.replace(target);
      } catch {
        window.location.replace('contact.html#connect-subscribe');
      }
    })();
  </script>
</head>
<body>
  <main class="section" style="min-height:60vh;display:grid;place-items:center;text-align:center;">
    <div>
      <h1 class="i18n l-zh">正在跳转至新的“联系与订阅”页面…</h1>
      <h1 class="i18n l-en">Redirecting to the new Connect page…</h1>
      <h1 class="i18n l-es">Redirigiendo a la nueva página de conexión…</h1>
      <p class="muted i18n l-zh"><a href="contact.html#connect-subscribe">若未自动跳转，请点击这里</a></p>
      <p class="muted i18n l-en"><a href="contact.html?lang=en#connect-subscribe">Click here if you are not redirected</a></p>
      <p class="muted i18n l-es"><a href="contact.html?lang=es#connect-subscribe">Haz clic aquí si la redirección no funciona</a></p>
    </div>
  </main>
</body>
</html>
