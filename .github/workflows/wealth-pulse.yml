name: Wealth Pulse

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: wealth-pulse
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm i
      - name: Generate market pulse
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          LLM_MODEL: deepseek-v4-flash
          NEWS_FACTS: ${{ vars.WEALTH_NEWS_FACTS }}
          NEWS_FACTS_PATH: ${{ vars.WEALTH_NEWS_FACTS_PATH }}
        run: node tools/wealth/generate-pulse.mjs
      - name: Validate wealth data
        run: npm run validate:wealth
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(wealth): pulse $(date -u +%F)"
            git push
          else
            echo "No changes to commit."
          fi
