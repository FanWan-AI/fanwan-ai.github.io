name: ModelWatch Tagging

on:
  push:
    branches: [ main ]
    paths:
      - 'data/ai/modelswatch/**'
      - 'data/ai/ai_categories.json'
      - 'tools/modelswatch_tagging.py'
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: modelswatch-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/modelswatch_tagging.py
            /data/ai/ai_categories.json
            /data/ai/modelswatch/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # No third-party deps required

      - name: Tag deterministically first
        run: |
          # Published snapshots/aliases are immutable as a pair. Enrich the library only.
          python tools/modelswatch_tagging.py data/ai/modelswatch/corpus.gh.json data/ai/modelswatch/corpus.hf.json

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/ai/modelswatch/corpus.gh.json data/ai/modelswatch/corpus.hf.json
            git commit -m "chore(modelswatch): enrich task_keys via taxonomy (CI)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
