name: ModelSwatch Stage A · Fetch & Drafts

on:
  workflow_dispatch:
    inputs:
      run_daily:
        description: "Run Stage A pipeline"
        default: "yes"
        required: false
        type: choice
        options:
          - yes
          - dry-run

concurrency:
  group: modelswatch-stage-a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stage A · Fetch & Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "[stage-a] Node version:" $(node -v)
          echo "[stage-a] npm version:" $(npm -v)
          if [ "${{ github.event.inputs.run_daily }}" = "dry-run" ]; then
            echo "[stage-a] Dry-run requested -> running daily.mjs --dry-run"
            node tools/modelswatch/daily.mjs --dry-run
          else
            node tools/modelswatch/daily.mjs
          fi

      - name: Commit Stage A artifacts
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git status --short
          git add data/ai/modelswatch || true
          git add tools/modelswatch/audit || true
          if git diff --cached --quiet; then
            echo "[stage-a] No changes produced; skipping commit"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "[stage-a] using target branch $TARGET_BRANCH"
          PROT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.luke-cage-preview+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${TARGET_BRANCH}/protection") || true
          if [ "$PROT_STATUS" = "200" ]; then
            echo "Branch '${TARGET_BRANCH}' appears protected; aborting commit to avoid failure."
            exit 1
          fi
          git commit -m "chore(modelswatch): stage A fetch & drafts"
          git fetch origin $TARGET_BRANCH || true
          if git rebase --autostash origin/$TARGET_BRANCH; then
            git push origin HEAD:$TARGET_BRANCH
          else
            git rebase --abort || true
            if git merge --no-edit origin/$TARGET_BRANCH; then
              git push origin HEAD:$TARGET_BRANCH || git push --force-with-lease origin HEAD:$TARGET_BRANCH
            else
              echo "[stage-a] Merge failed; aborting"
              exit 1
            fi
          fi
