name: AI Startup Publish Case

on:
  workflow_dispatch:
    inputs:
      draft_run_id:
        description: 'Run ID of the reviewed AI Startup Case Weekly Draft artifact'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: startup-publish-case
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/startup
            data/ai/startup
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$DRAFT_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRAFT_RUN_ID" > "$RUNNER_TEMP/case-run.json"
          jq -e '.name == "AI Startup Case Weekly Draft" and .head_branch == "main" and .conclusion == "success"' "$RUNNER_TEMP/case-run.json"
      - uses: actions/download-artifact@v4
        with:
          name: startup-case-draft-${{ inputs.draft_run_id }}
          run-id: ${{ inputs.draft_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reviewed-case
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate and publish reviewed case
        run: |
          mapfile -t drafts < <(find "$RUNNER_TEMP/reviewed-case/cases/drafts" -type f -name '*.json')
          test "${#drafts[@]}" -eq 1
          node tools/startup/validate.mjs --draft "${drafts[0]}"
          node tools/startup/promote-case.mjs --draft "${drafts[0]}"
          npm run startup:validate
      - name: Commit published case only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai/startup/cases/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(startup): publish reviewed case analysis'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
