name: ModelSwatch Stage C · Analysis & Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use --dry-run for analysis & publish"
        required: false
        default: "no"
        type: choice
        options:
          - no
          - yes

concurrency:
  group: modelswatch-stage-c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-c:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stage C · Analysis & Publish
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "yes" ]; then
            echo "[stage-c] Running Stage C in dry-run mode"
            node tools/modelswatch/data_analysis.mjs --dry-run
            node tools/modelswatch/qualify_publish.mjs --dry-run
            node tools/modelswatch/maintain_audit.mjs --dry-run
            exit 0
          fi
          node tools/modelswatch/data_analysis.mjs
          node tools/modelswatch/qualify_publish.mjs
          node tools/modelswatch/maintain_audit.mjs

      - name: Commit Stage C artifacts
        if: ${{ github.event.inputs.dry_run != 'yes' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git status --short
          git add data/ai/modelswatch || true
          git add tools/modelswatch/audit || true
          if git diff --cached --quiet; then
            echo "[stage-c] No changes produced; skipping commit"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "[stage-c] using target branch $TARGET_BRANCH"
          PROT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.luke-cage-preview+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${TARGET_BRANCH}/protection") || true
          if [ "$PROT_STATUS" = "200" ]; then
            echo "Branch '${TARGET_BRANCH}' appears protected; aborting commit to avoid failure."
            exit 1
          fi
          git commit -m "chore(modelswatch): stage C publish"
          git fetch origin $TARGET_BRANCH || true
          if git rebase --autostash origin/$TARGET_BRANCH; then
            git push origin HEAD:$TARGET_BRANCH
          else
            git rebase --abort || true
            if git merge --no-edit origin/$TARGET_BRANCH; then
              git push origin HEAD:$TARGET_BRANCH || git push --force-with-lease origin HEAD:$TARGET_BRANCH
            else
              echo "[stage-c] Merge failed; aborting"
              exit 1
            fi
          fi
