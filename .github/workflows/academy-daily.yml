name: "Academy Daily: LLM + TTS"

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: academy-daily
  cancel-in-progress: true

jobs:
  generate-tts:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      LLM_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      TTS_VOICE: ${{ secrets.ACADEMY_TTS_VOICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Academy lesson
        run: npm run academy:generate

      - name: Validate Academy data
        run: npm run academy:validate

      - name: Synthesize Academy TTS
        run: npm run academy:tts

      - name: Commit and push changes (if any)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore(academy): daily lesson & tts auto-update [skip ci]" || exit 0
          git push || true
