name: "Academy Daily: LLM + TTS"

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: academy-daily
  cancel-in-progress: true

jobs:
  generate-tts:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      LLM_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      TTS_VOICE: ${{ secrets.ACADEMY_TTS_VOICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies for TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install dashscope requests

      - name: Run Academy pipeline twice
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          for iteration in 1 2; do
            echo "::group::Academy pipeline run ${iteration}"
            npm run academy:generate
            npm run academy:validate
            npm run academy:tts

            if git diff --quiet; then
              echo "Run ${iteration}: No changes to commit"
            else
              git add -A
              git commit -m "chore(academy): daily lesson & tts auto-update (run ${iteration}) [skip ci]" || true
              git push || true
            fi
            echo "::endgroup::"
          done
