name: AI Startup Case Weekly Draft

on:
  schedule:
    - cron: "23 0 * * 2"
  workflow_dispatch:
    inputs:
      topic:
        description: "Company, decision, or question for the case anatomy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: startup-case-weekly
  cancel-in-progress: true

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Singapore
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CASE_TOPIC: ${{ inputs.topic }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/startup
            data/ai/startup

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run startup:test

      - name: Generate verified case draft (never publish)
        run: |
          topic="${CASE_TOPIC:-AI startup technical commercialization case study}"
          node tools/startup/generate-case-draft.mjs --topic "$topic" --output-root "$RUNNER_TEMP/startup-case-output"

      - name: Validate generated draft contract
        run: |
          draft=$(find "$RUNNER_TEMP/startup-case-output/cases/drafts" -type f -name '*.json' | head -n 1)
          test -n "$draft"
          node tools/startup/validate.mjs --draft "$draft"

      - name: Upload case draft and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-case-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/startup-case-output
          if-no-files-found: error
          retention-days: 30
