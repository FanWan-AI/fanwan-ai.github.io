name: "Business & Econ Daily: Generate data + zh TTS"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wealth-daily
  cancel-in-progress: true

jobs:
  build-and-tts:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      LLM_MODEL: deepseek-v4-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Wealth Daily data
        run: node tools/wealth/generate-daily.mjs

      - name: Generate Wealth Pulse data
        run: node tools/wealth/generate-pulse.mjs || echo "pulse generation had non-fatal errors"

      - name: Validate Wealth data
        run: node tools/wealth/validate.mjs

      - name: Install Python dependencies for TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install dashscope requests

      - name: Generate TTS (Chinese only)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_TTS_MIN_INTERVAL: '1.2'
          DASHSCOPE_TTS_RATE_LIMIT_BASE_WAIT: '4.0'
          DASHSCOPE_TTS_RATE_LIMIT_MAX_WAIT: '24.0'
          DASHSCOPE_TTS_RATE_LIMIT_MAX_RETRIES: '8'
          DASHSCOPE_TTS_KEEP_SEGMENTS: '1'
        run: python tools/wealth/tts_daily.py --langs zh

      - name: Commit and push changes (if any)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(wealth): daily/pulse/tts auto-update [skip ci]"
            # Try to push; if remote has new commits, fetch and rebase then push again.
            set -e
            git remote set-url origin "$(git config --get remote.origin.url)"
            git fetch origin --depth=1 || true
            # Attempt a normal push first
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Initial push failed; attempting to rebase onto origin/main and push again"
            # Try rebase onto remote main (best-effort). If rebase fails, fall back to merge.
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git fetch origin $BRANCH || true
            if git rebase --autostash origin/$BRANCH; then
              git push || true
            else
              echo "Rebase failed; trying merge instead"
              git rebase --abort || true
              git merge --no-edit origin/$BRANCH || true
              git push || true
            fi
            # As a last resort, use force-with-lease to avoid accidentally overwriting remote work
            if ! git rev-parse --verify --quiet origin/$BRANCH >/dev/null; then
              echo "Remote branch not found; final push"
              git push --set-upstream origin $BRANCH || true
            else
              echo "Attempting final push with --force-with-lease if needed"
              git push --force-with-lease || true
            fi
          else
            echo "No changes to commit."
          fi
