name: "Trade Daily: Generate data"

on:
  workflow_dispatch:
  schedule:
    # Run daily at 00:30 UTC (08:30 China Standard Time)
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: trade-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      LLM_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Trade Daily data
        run: node tools/trade/generate-daily.mjs

      - name: Commit and push changes (if any)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(trade): daily auto-update [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
