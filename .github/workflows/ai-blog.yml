name: AI Paper Hub Daily
'on':
  schedule:
    - cron: '0 0 * * *' # Every day, 08:00 Asia/Shanghai; Actions may queue.
  workflow_dispatch:

concurrency:
  group: paperhub-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows
            tools/paperhub
            assets/paperhub
            tests/paperhub
            data/ai/scholarpush
            lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Offline publication and rendering tests
        run: node --test tests/paperhub/*.test.mjs
      - name: Generate and validate before publication
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          PAPERHUB_MAX_ITEMS: '5'
          PAPERHUB_MAX_CANDIDATES: '8'
          PAPERHUB_MAX_CALLS: '1'
          PAPERHUB_LOOKBACK_DAYS: '7'
          PAPERHUB_OUTPUT_DIR: data/ai/scholarpush
        run: node tools/paperhub/generate.mjs --publish
      - name: Commit only validated paper editions
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EDITION_DATE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('data/ai/scholarpush/index.json','utf8')).date)")
          git add -- data/ai/scholarpush/index.json data/ai/scholarpush/dates.json "data/ai/scholarpush/${EDITION_DATE}.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(paperhub): research edition ${EDITION_DATE}"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
