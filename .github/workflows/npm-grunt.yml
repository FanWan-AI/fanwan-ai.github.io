name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 如果你的站点不需要构建，直接把仓库根目录作为工件上传即可
      - name: Upload artifact (only public site files)
        uses: actions/upload-pages-artifact@v3
        with:
          # Limit the upload to only the site pages and public assets.
          # Use a multiline list of paths to avoid uploading the full repo
          # (including .git pack files and large PDFs in assets/), which
          # can make the Pages upload very slow or time out.
          path: |
            index.html
            about.html
            blog.html
            contact.html
            manifest.webmanifest
            rss.xml
            rss-en.xml
            rss-es.xml
            style.css
            script.js
            sw.js
            assets
            blog
            data

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
