name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [AI Startup Opportunity Daily, AI Startup Publish Case, ai-radar-pipeline, ModelWatch Tagging, ModelSwatch Daily · Full Pipeline, Build Blog from Markdown, AI Paper Hub Daily]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest site without retired audio
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/audio/daily/
            !/assets/test-og.svg
            !/lab/games.disabled/
            !/data/ai/daily-academy/
            !/data/ai/wealth/
            !/data/ai/trade/
            !/data/ai/games/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare public files only
        run: node scripts/prepare-pages.mjs

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp/pages-upload

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
