name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 如果你的站点不需要构建，直接把仓库根目录作为工件上传即可
      - name: Prepare Pages upload directory
        run: |
          set -e
          rm -rf pages_upload || true
          mkdir -p pages_upload
          # Copy only existing site files and directories into pages_upload
          for p in index.html about.html blog.html contact.html manifest.webmanifest rss.xml rss-en.xml rss-es.xml style.css script.js sw.js assets blog data; do
            if [ -e "$p" ]; then
              echo "Including: $p"
              cp -R "$p" pages_upload/
            else
              echo "Skipping missing: $p"
            fi
          done

      - name: Upload artifact (pages_upload)
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_upload

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
