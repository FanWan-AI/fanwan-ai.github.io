name: ModelSwatch Daily · Full Pipeline

on:
  schedule:
    - cron: '30 2 * * *' # Daily 10:30 Asia/Shanghai; Actions may queue.
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: modelswatch-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows
            lab/modelswatch.html
            package.json
            package-lock.json
            tools/modelswatch
            tools/startup
            assets/modelswatch
            tests/modelswatch
            data/ai/ai_categories.json
            data/ai/modelswatch/schemas
            data/ai/modelswatch/daily
            data/ai/modelswatch/daily_temp_data
            data/ai/modelswatch/index
            data/ai/modelswatch/summary_cache.json
            data/ai/modelswatch/corpus.gh.json
            data/ai/modelswatch/corpus.hf.json
            data/ai/modelswatch/daily_github.json
            data/ai/modelswatch/daily_hf.json
            data/ai/modelswatch/latest_release.json
            data/ai/modelswatch/task_aliases.json
            data/ai/modelswatch/models_categories.json
            data/ai/modelswatch/categories.json
            data/ai/modelswatch/project_categories.json
            data/ai/modelswatch/models_hotlist.json
            data/ai/modelswatch/projects_hotlist.json
            data/ai/modelswatch/state.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Offline regression checks
        run: node --test tests/modelswatch/*.test.mjs
      - name: Discover, interpret, validate and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_RETRIES: '0'
          DEEPSEEK_TIMEOUT_MS: '120000'
        run: |
          set -euo pipefail
          DAY="$(TZ=Asia/Shanghai date +%F)"
          node tools/modelswatch/daily.mjs --date="$DAY" --per-source=6
          node tools/modelswatch/enrich.mjs --date="$DAY" --per-source=4 --max-calls=6
          node tools/modelswatch/data_analysis.mjs --date="$DAY"
          node tools/modelswatch/qualify_publish.mjs --date="$DAY" --limit=4
      - name: Commit verified artifacts
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai/modelswatch tools/modelswatch/audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(modelswatch): publish source-grounded daily edition"
          git fetch origin "$TARGET_BRANCH"
          if ! git rebase "origin/$TARGET_BRANCH"; then
            git rebase --abort
            echo "::error::Concurrent changes conflict. No force push; rerun from current main."
            exit 1
          fi
          git push origin "HEAD:$TARGET_BRANCH"
