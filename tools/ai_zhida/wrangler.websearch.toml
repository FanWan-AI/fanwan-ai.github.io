name = "websearch-proxy"
main = "websearch-proxy-worker.js"
compatibility_date = "2023-10-30"

[vars]
# Default configuration
DEFAULT_FRESHNESS = "month"
MAX_RESULTS = "10"
# Allow local development and production site
ALLOWED_ORIGINS = "https://fanwan-ai.github.io,http://127.0.0.1:8080,http://localhost:8080"
DEBUG = "1"

# Note: You must set BRAVE_API_KEY using `wrangler secret put BRAVE_API_KEY`
