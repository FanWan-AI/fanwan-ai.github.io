    .rad-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .rad-card { border-radius: 22px; border: 1px solid var(--rad-card-border); background: var(--rad-card-bg); box-shadow: var(--rad-card-shadow); padding: 24px; display: flex; flex-direction: column; gap: 16px; color: var(--rad-text-body); transition: transform .18s ease, box-shadow .18s ease; position: relative; min-height: 100%; }
  .rad-card.rad-toolbar { flex-direction: row; padding: 18px 20px; gap: 14px; align-items: center; }
    .rad-card:hover { transform: translateY(-4px); box-shadow: 0 30px 56px -28px rgba(37, 99, 235, 0.32); }

  .rad-card-title { flex: 1 1 auto; min-width: 0; }

    .rad-title a { color: inherit; text-decoration: none; }
    .rad-title a:hover { text-decoration: underline; }

  :root[data-theme="dark"] .rad-link:hover { background: color-mix(in oklab, var(--rad-primary), #111f34 10%); }

  .rad-card-body { flex: 1 1 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .rad-meta { font-size: 13px; color: var(--rad-text-muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .rad-excerpt { margin: 0; font-size: 14px; color: var(--rad-text-body); line-height: 1.65; display: block; white-space: normal; overflow: visible; text-overflow: clip; word-wrap: break-word; max-height: 120px; overflow-y: auto; }
    .rad-excerpt.secondary { color: var(--rad-text-muted); }
    .rad-excerpt--empty { font-style: italic; color: var(--rad-text-muted); }
  .rad-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

  #rad-top .rad-card { border-style: dashed; border-color: color-mix(in oklab, var(--rad-card-border), var(--rad-primary) 35%); background: var(--rad-card-bg-soft); box-shadow: none; }
