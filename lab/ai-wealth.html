  <script>
    (function() {
      try {
        const root = document.documentElement;
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        root.setAttribute('data-theme', theme);
      } catch (error) {
        console.warn('Theme bootstrap failed', error);
      }
    })();
  </script>

  <style>
    .wealth-hero {
      padding: 72px 16px 48px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(59, 130, 246, 0.16));
      border-bottom: 1px solid rgba(16, 185, 129, 0.18);
    }
    .wealth-hero .container {
      display: grid;
      gap: 32px;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
    }
    .wealth-title {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 4vw, 3.4rem);
      font-weight: 700;
      color: var(--text-strong, #0f172a);
      line-height: 1.15;
    }
    .wealth-subtitle {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--muted, #4b5563);
      max-width: 680px;
    }
    .wealth-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    .wealth-pill {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(15, 118, 110, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.24);
      color: var(--text-strong, #0f172a);
      letter-spacing: 0.02em;
    }
    .wealth-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 16px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
    }
    .wealth-card {
      background: color-mix(in srgb, var(--surface, #ffffff) 88%, rgba(15, 118, 110, 0.08));
      border: 1px solid color-mix(in srgb, rgba(15, 118, 110, 0.18), rgba(56, 189, 248, 0.16));
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 24px 60px -32px rgba(15, 118, 110, 0.25);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .wealth-card h2 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-strong, #0f172a);
    }
    .wealth-card p {
      margin: 0;
      color: var(--text, #1f2937);
      line-height: 1.6;
    }
    .wealth-notice {
      font-size: 0.95rem;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.34);
      color: #991b1b;
      line-height: 1.5;
    }
    .wealth-columns {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr);
      gap: 32px;
    }
    .wealth-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    @media (max-width: 960px) {
      .wealth-columns {
        grid-template-columns: 1fr;
      }
    }
    .wealth-skeleton {
      display: grid;
      gap: 16px;
    }
    .wealth-skeleton .line {
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(15,118,110,0.12), rgba(16,185,129,0.32), rgba(15,118,110,0.12));
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
