    .hub-container { max-width: 1120px; margin: 0 auto; padding: 0 16px 80px; }

  .hub-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }

  .hub-chiprow { display: flex; gap: 8px; flex-wrap: wrap; }
  .hub-chip { border: 1px solid var(--hub-chip-border); border-radius: 999px; padding: 6px 12px; font-size: 13px; background: var(--hub-chip-bg); color: var(--hub-text-muted); cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
  .hub-chip:hover { background: color-mix(in oklab, var(--hub-chip-bg), var(--hub-primary) 18%); color: var(--hub-text-strong); }
  .hub-chip.active { background: var(--hub-primary); color: #fff; border-color: var(--hub-primary); box-shadow: 0 12px 26px -18px color-mix(in oklab, var(--hub-primary), #000 35%); }
  .hub-chip .chip-count { padding: 2px 6px; border-radius: 999px; font-size: 11px; font-weight: 600; background: color-mix(in oklab, var(--hub-primary-soft), transparent 35%); color: color-mix(in oklab, var(--hub-primary), var(--hub-text-strong) 25%); line-height: 1.2; }
  .hub-chip.active .chip-count { background: color-mix(in oklab, #ffffff, transparent 55%); color: color-mix(in oklab, var(--hub-primary), #000 10%); }
  :root[data-theme="dark"] .hub-chip .chip-count { background: color-mix(in oklab, rgba(120,148,255,0.55), transparent 30%); color: color-mix(in oklab, #dfe7ff, var(--hub-primary) 15%); }

  .hub-stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 12px; margin: 16px 0 24px; }
  .hub-stat { padding: 18px; border-radius: 18px; border: 1px solid var(--hub-card-border); background: var(--hub-card-bg); box-shadow: var(--hub-card-shadow); display: flex; flex-direction: column; gap: 6px; color: var(--hub-text-body); }
  .hub-stat h4 { margin: 0; font-size: 30px; font-weight: 700; color: var(--hub-primary); }

  .hub-card.milestone { padding: 22px 24px; }

  .milestone-header h3 { margin: 0; font-size: 20px; font-weight: 700; color: var(--hub-text-strong); }
  .milestone-header .muted { color: var(--hub-text-body); font-size: 14px; }

    .milestone-actions { display: flex; gap: 10px; align-items: center; }
    .milestone-toggle { border: none; background: var(--hub-primary); color: #fff; font-weight: 600; font-size: 14px; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
    .milestone-toggle:hover { background: color-mix(in oklab, var(--hub-primary), #000 6%); }
    .milestone-body { margin-top: 14px; border-top: 1px solid var(--hub-card-border); padding-top: 16px; display: none; }
    .milestone-body.active { display: block; }
    .milestone-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .milestone-tag { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--hub-tag-bg); color: color-mix(in oklab, var(--hub-primary), var(--hub-text-strong) 45%); border: 1px solid var(--hub-tag-border); }
    .milestone-phase { margin-bottom: 18px; }
    .milestone-phase h4 { margin: 0 0 10px; font-size: 15px; font-weight: 700; color: color-mix(in oklab, var(--hub-primary), var(--hub-text-strong) 35%); text-transform: uppercase; letter-spacing: 0.05em; }
    .milestone-list { display: grid; gap: 12px; }
    .milestone-item { border: 1px solid var(--hub-card-border); border-radius: 14px; padding: 16px; background: var(--hub-card-bg-soft); box-shadow: var(--hub-card-shadow); display: grid; gap: 8px; }

  .milestone-item .meta { font-size: 13px; color: var(--hub-text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .milestone-item .score { font-weight: 600; color: var(--hub-primary); }
  .milestone-item .summary { margin: 0; font-size: 14px; line-height: 1.55; color: var(--hub-text-body); }
  .milestone-item .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--hub-badge-bg); color: color-mix(in oklab, var(--hub-primary), var(--hub-text-strong) 35%); border: 1px solid var(--hub-tag-border); }
  .milestone-empty { padding: 16px; border-radius: 12px; border: 1px dashed var(--hub-card-border); text-align: center; font-size: 13px; color: var(--hub-text-muted); }

  .hub-error { padding: 16px; border-radius: 12px; border: 1px solid rgba(220, 38, 38, 0.35); background: rgba(248, 113, 113, 0.12); color: color-mix(in oklab, #fca5a5, #7f1d1d 45%); margin: 12px 0; backdrop-filter: blur(4px); }
  .hub-loading { padding: 18px; border-radius: 12px; border: 1px dashed var(--hub-card-border); text-align: center; color: var(--hub-text-muted); background: var(--hub-card-bg); }

    @media (max-width: 720px) {
      .hub-card { padding: 16px; }
      .milestone-item { padding: 14px; }
    }
  </style>

      const HIGHLIGHTS_URL = `${DATA_BASE}/data/ai/scholarpush/index.json`;
      const TAG_ALIAS_URL = `${DATA_BASE}/data/ai/scholarpush/tag_aliases.json`;
      const MILESTONE_INDEX_URL = `${DATA_BASE}/data/ai/scholarpush/milestones/index.json`;

      const highlightSearch = document.getElementById('highlight-search');
      const highlightList = document.getElementById('highlight-list');
      const highlightStats = document.getElementById('highlight-stats');
      const highlightEmpty = document.getElementById('highlight-empty');
      const highlightChips = document.getElementById('highlight-chips');

      const milestoneSearch = document.getElementById('milestone-search');
      const milestoneTags = document.getElementById('milestone-tags');
      const milestoneList = document.getElementById('milestone-list');

      const tabButtons = document.querySelectorAll('.hub-tabbar .tab-btn');
      const panels = {
        highlights: document.getElementById('panel-highlights'),
        milestones: document.getElementById('panel-milestones')
      };

      const phaseLabels = {
        origin: { zh: '起点', en: 'Origin', es: 'Origen' },
        milestone: { zh: '里程碑', en: 'Milestone', es: 'Hito' },
        bridge: { zh: '过渡', en: 'Bridge', es: 'Puente' },
        frontier: { zh: '前沿', en: 'Frontier', es: 'Frontera' },

      };

      const TAG_LABELS = {
  NLP: { zh: '自然语言处理', en: 'NLP', es: 'PLN' },
        Robotics: { zh: '机器人', en: 'Robotics', es: 'Robótica' },
        '3D': { zh: '3D', en: '3D', es: '3D' },

        Agent: { zh: '智能体', en: 'Agent', es: 'Agente' },
        Multimodal: { zh: '多模态', en: 'Multimodal', es: 'Multimodalidad' },
        'Computer Vision': { zh: '计算机视觉', en: 'Computer Vision', es: 'Visión por Computador' },
        Speech: { zh: '语音', en: 'Speech', es: 'Voz' },
        Safety: { zh: '安全', en: 'Safety', es: 'Seguridad' },
        Evaluation: { zh: '评测', en: 'Evaluation', es: 'Evaluación' },
        Optimization: { zh: '优化', en: 'Optimization', es: 'Optimización' },
        Dataset: { zh: '数据集', en: 'Dataset', es: 'Conjunto de datos' },
        Infrastructure: { zh: '基础设施', en: 'Infrastructure', es: 'Infraestructura' },
        Policy: { zh: '政策', en: 'Policy', es: 'Política' },
        'Open Source': { zh: '开源', en: 'Open Source', es: 'Código abierto' },
        Robustness: { zh: '鲁棒性', en: 'Robustness', es: 'Robustez' },
  'Representation Learning': { zh: '表示学习', en: 'Representation Learning', es: 'Aprendizaje de representaciones' },
  Synthesis: { zh: '合成', en: 'Synthesis', es: 'Síntesis' },
  Dialogue: { zh: '对话', en: 'Dialogue', es: 'Diálogo' },
  'Generative Models': { zh: '生成模型', en: 'Generative Models', es: 'Modelos generativos' },
  Pretraining: { zh: '预训练', en: 'Pretraining', es: 'Preentrenamiento' },
        优化: { zh: '优化', en: 'Optimization', es: 'Optimización' },
        噪声: { zh: '噪声', en: 'Noise', es: 'Ruido' },
        图像生成: { zh: '图像生成', en: 'Image Generation', es: 'Generación de imágenes' },
        声音: { zh: '声音', en: 'Sound', es: 'Sonido' },
        安全: { zh: '安全', en: 'Safety', es: 'Seguridad' },
        平衡: { zh: '平衡', en: 'Equilibrium', es: 'Equilibrio' },
        推理: { zh: '推理', en: 'Reasoning', es: 'Razonamiento' },
        检测: { zh: '检测', en: 'Detection', es: 'Detección' },
        物理: { zh: '物理', en: 'Physics', es: 'Física' },
        生成建模: { zh: '生成建模', en: 'Generative Modeling', es: 'Modelado generativo' },
        蒸馏: { zh: '蒸馏', en: 'Distillation', es: 'Destilación' },
        视频: { zh: '视频', en: 'Video', es: 'Video' }
      };

      const TAG_LABELS_LOWER = new Map(
        Object.entries(TAG_LABELS).map(([key, value]) => [key.toLowerCase(), value])
      );

      const state = {
        aliasMap: new Map(),
        highlights: [],
        highlightFilters: new Set(),
        milestonesIndex: [],
        milestoneFilters: new Set(),
        milestoneCache: new Map(),
        loadingHighlights: true,
        loadingMilestones: true,
        hasHighlightData: false,
        hasMilestoneData: false
      };

      function getLang() {
        return document.documentElement.lang || localStorage.getItem('lang') || 'zh';
      }

      function tRaw(key) {
        const lang = getLang();
        return window.translations?.[lang]?.[key] ?? window.translations?.en?.[key] ?? '';
      }

      function tr(key, replacements = {}, fallback = '') {
        let text = tRaw(key);
        if (!text) text = fallback;
        if (!text) return '';
        for (const [token, value] of Object.entries(replacements)) {
          text = text.replace(new RegExp(`\\{${token}\\}`, 'g'), value);
        }
        return text;
      }

      function pickLocale(map) {
        if (!map) return '';
        const lang = getLang();
        return map[lang] || map.en || map.zh || map.es || '';
      }

      function formatDate(iso) {
        if (!iso) return '';
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return '';
        return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')}`;
      }

      function buildAliasMap(entries) {
        const map = new Map();
        for (const entry of entries || []) {
          const canonical = String(entry.canonical || '').trim();
          if (!canonical) continue;
          map.set(canonical.toLowerCase(), canonical);
          for (const alias of entry.aliases || []) {
            const key = String(alias || '').trim().toLowerCase();
            if (!key) continue;
            if (!map.has(key)) map.set(key, canonical);
          }
        }
        return map;
      }

      function canonicalize(tag) {
        const key = String(tag || '').trim();
        if (!key) return '';
        const canonical = state.aliasMap.get(key.toLowerCase());
        return canonical || key;
      }

      function translateTag(tag) {
        const raw = String(tag || '').trim();
        if (!raw) return '';
        const canonical = canonicalize(raw);
        const candidates = [canonical, raw];
        let record = null;
        for (const key of candidates) {
          if (key && TAG_LABELS[key]) {
            record = TAG_LABELS[key];
            break;
          }
        }
        if (!record) {
          const lowerCandidates = candidates
            .filter(Boolean)
            .map((key) => key.toLowerCase());
          for (const lower of lowerCandidates) {
            if (TAG_LABELS_LOWER.has(lower)) {
              record = TAG_LABELS_LOWER.get(lower);
              break;
            }
          }
        }
        if (!record) return canonical || raw;
        const lang = getLang();
        return record[lang] || record.en || record.zh || record.es || canonical || raw;
      }

      function fetchJSON(url) {
        return fetch(url, { cache: 'no-cache' }).then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        });
      }

      function syncStaticText() {
        if (highlightSearch) {
          highlightSearch.setAttribute('placeholder', tr('paperhub_search_highlight_placeholder', {}, '搜索标题、标签或摘要'));
          highlightSearch.setAttribute('aria-label', tr('paperhub_search_highlight_aria', {}, '搜索最新论文'));
        }
        if (milestoneSearch) {
          milestoneSearch.setAttribute('placeholder', tr('paperhub_search_milestone_placeholder', {}, '搜索任务、关键字'));
          milestoneSearch.setAttribute('aria-label', tr('paperhub_search_milestone_aria', {}, '搜索任务'));
        }
        if (highlightChips) {
          highlightChips.setAttribute('aria-label', tr('paperhub_chip_highlight_aria', {}, '快速筛选'));
        }
        if (milestoneTags) {
          milestoneTags.setAttribute('aria-label', tr('paperhub_chip_milestone_aria', {}, '任务标签过滤'));
        }
        if (highlightEmpty) {
          highlightEmpty.textContent = tr('paperhub_empty_highlight', {}, '没有匹配的论文，换个关键词试试。');
        }
      }

      function renderHighlightStats(items) {
        if (!highlightStats) return;
        if (!items.length) {
          highlightStats.innerHTML = '';
          return;
        }
        const total = items.length;
        const withCode = items.filter((it) => it.has_code).length;
        const avgImpact = Math.round(items.reduce((sum, it) => sum + (Number(it.impact_score) || 0), 0) / total);
        const timeSpan = items.reduce((acc, it) => {
          const time = new Date(it.ts || it.date || it.generated_at || '');
          if (Number.isNaN(time.getTime())) return acc;
          const iso = time.toISOString();
          if (!acc.min || iso < acc.min) acc.min = iso;
          if (!acc.max || iso > acc.max) acc.max = iso;
          return acc;
        }, { min: null, max: null });

        const spanText = timeSpan.min && timeSpan.max
          ? `${formatDate(timeSpan.min)} → ${formatDate(timeSpan.max)}`
          : '';

        const codeCaption = tr('paperhub_stat_code_caption', { count: withCode }, '{count} 篇附带代码仓库');

        highlightStats.innerHTML = `
          <article class="hub-stat">
            <span>${tr('paperhub_stat_highlight_label', {}, '当日精选数量')}</span>
            <h4>${total}</h4>
            <span>${tr('paperhub_stat_highlight_caption', {}, '记录的论文条目')}</span>
          </article>
          <article class="hub-stat">
            <span>${tr('paperhub_stat_impact_label', {}, '平均影响评分')}</span>
            <h4>${Number.isNaN(avgImpact) ? '—' : avgImpact}</h4>
            <span>${tr('paperhub_stat_impact_caption', {}, 'Impact Score (0-100)')}</span>
          </article>
          <article class="hub-stat">
            <span>${tr('paperhub_stat_code_label', {}, '含代码比例')}</span>
            <h4>${total ? Math.round((withCode / total) * 100) : 0}%</h4>
            <span>${codeCaption}</span>
          </article>
          <article class="hub-stat">
            <span>${tr('paperhub_stat_range_label', {}, '收录时间范围')}</span>
            <h4>${spanText || '—'}</h4>
            <span>${tr('paperhub_stat_range_caption', {}, '按最新 JSON 统计')}</span>
          </article>`;
      }

      function highlightTitle(item) {
        return pickLocale(item.title_i18n) || item.headline || item.title || '';
      }

      function highlightSummary(item) {
        const preferred = pickLocale(item.summary_i18n);
        if (preferred) return preferred;
        const lang = getLang();
        if (lang === 'zh') return item.quick_read || item.one_liner || '';
        if (lang === 'en') return (item.summary_i18n && item.summary_i18n.en) || item.one_liner || '';
        if (lang === 'es') return (item.summary_i18n && item.summary_i18n.es) || item.one_liner || '';
        return item.one_liner || '';
      }

      function renderHighlightChips(items) {
        if (!highlightChips) return;
        const counts = new Map();
        for (const item of items) {
          const set = new Set();
          const tags = (item.tags || []).map(canonicalize);
          tags.forEach((tag) => { if (tag) set.add(tag); });
          if (item.task) set.add(canonicalize(item.task));
          for (const tag of set) {
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }
        const sorted = Array.from(counts.entries())
          .filter(([tag]) => tag && tag.toUpperCase() !== 'N/A')
          .sort((a, b) => b[1] - a[1])
          .slice(0, 12);
        highlightChips.innerHTML = sorted
          .map(([tag, count]) => {
            const label = translateTag(tag);
            return `<button class="hub-chip" data-tag="${tag}" aria-pressed="false"><span>${label}</span><span class="chip-count" aria-hidden="true">${count}</span></button>`;
          })
          .join('');
        highlightChips.querySelectorAll('.hub-chip').forEach((btn) => {
          const tag = btn.dataset.tag;
          if (state.highlightFilters.has(tag)) {
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          }
          btn.addEventListener('click', () => {
            const wasActive = state.highlightFilters.has(tag);
            state.highlightFilters.clear();
            highlightChips.querySelectorAll('.hub-chip').forEach((chip) => {
              chip.classList.remove('active');
              chip.setAttribute('aria-pressed', 'false');
            });
            if (!wasActive) {
              state.highlightFilters.add(tag);
              btn.classList.add('active');
              btn.setAttribute('aria-pressed', 'true');
            }
            renderHighlights();
          });
        });
      }

      function formatBadge(item) {
        const badges = [];
        if (item.impact_score) {
          badges.push(`<span class="badge" title="${tr('paperhub_badge_impact_title', {}, 'Impact Score')}">${tr('paperhub_badge_impact', {}, 'Impact')} ${item.impact_score}</span>`);
        }
        if (item.reproducibility_score) {
          badges.push(`<span class="badge" title="${tr('paperhub_badge_repro_title', {}, 'Reproducibility Score')}">${tr('paperhub_badge_repro', {}, 'Repro')} ${item.reproducibility_score}</span>`);
        }
        if (item.has_code) {
          badges.push(`<span class="badge" title="${tr('paperhub_badge_code_title', {}, 'Has code repository')}">${tr('paperhub_badge_code', {}, 'Code')}</span>`);
        }
        return badges.join(' ');
      }

      function bestLink(item) {
        const links = item.links || {};
        if (links.paper && links.paper !== 'N/A') return { label: tr('paperhub_link_paper', {}, '论文'), url: links.paper };
        if (links.project && links.project !== 'N/A') return { label: tr('paperhub_link_project', {}, '项目'), url: links.project };
        if (links.code && links.code !== 'N/A') return { label: tr('paperhub_link_code', {}, '代码'), url: links.code };
        if (links.pdf && links.pdf !== 'N/A') return { label: tr('paperhub_link_pdf', {}, 'PDF'), url: links.pdf };
        return null;
      }

      function renderHighlights() {
        if (!highlightList) return;
        if (state.loadingHighlights) return;
        if (!state.hasHighlightData && state.highlights.length === 0) return;
        if (highlightEmpty) {
          highlightEmpty.textContent = tr('paperhub_empty_highlight', {}, '没有匹配的论文，换个关键词试试。');
        }
        const query = (highlightSearch?.value || '').trim().toLowerCase();
        const tags = Array.from(state.highlightFilters);
        const filtered = state.highlights.filter((item) => {
          if (tags.length) {
            const itemTags = new Set((item.tags || []).map(canonicalize));
            if (item.task) itemTags.add(canonicalize(item.task));
            const hasAll = tags.every((tag) => itemTags.has(tag));
            if (!hasAll) return false;
          }
          if (!query) return true;
          const blob = [highlightTitle(item), highlightSummary(item), (item.tags || []).join(' '), item.task || '', item.type || '']
            .join(' ')
            .toLowerCase();
          return blob.includes(query);
        });

        renderHighlightStats(filtered);
        const hasItems = filtered.length > 0;
        if (highlightEmpty) highlightEmpty.hidden = hasItems;
        if (!hasItems) {
          highlightList.innerHTML = '';
          return;
        }
        highlightList.innerHTML = filtered
          .map((item) => {
            const title = highlightTitle(item);
            const summary = highlightSummary(item) || tr('paperhub_no_summary', {}, '摘要即将上线，敬请期待。');
            const metaParts = [];
            if (item.task) metaParts.push(translateTag(item.task));
            if (item.type) metaParts.push(item.type);
            if (item.host) metaParts.push(item.host.replace(/^https?:\/\//, ''));
            const ts = formatDate(item.ts || item.date || item.generated_at || '');
            if (ts) metaParts.push(ts);
            const link = bestLink(item);
            const tagsHtml = (item.tags || [])
              .map(canonicalize)
              .filter((tag) => tag && tag.toUpperCase() !== 'N/A')
              .map((tag) => `<span class="hub-tag" data-tag="${tag}">${translateTag(tag)}</span>`)
              .join('');
            const kn = (item.key_numbers_compact || [])
              .map((badge) => `<span class="hub-tag">${badge}</span>`)
              .join('');
            const badges = formatBadge(item);
            return `
              <article class="hub-card" data-id="${item.id || ''}">
                <div class="hub-meta">
                  ${badges}
                </div>
                <h3 class="hub-title">${title}</h3>
                <p class="hub-summary">${summary}</p>
                <div class="hub-meta">
                  ${metaParts.join(' · ')}
                </div>
                <div class="hub-tags">${tagsHtml}${kn}</div>
                <div class="hub-links">
                  ${link ? `<a href="${link.url}" target="_blank" rel="noopener">${link.label} →</a>` : ''}
                  ${(item.links && item.links.code && item.links.code !== 'N/A') ? `<a href="${item.links.code}" target="_blank" rel="noopener">${tr('paperhub_link_code', {}, '代码')} →</a>` : ''}
                </div>
              </article>`;
          })
          .join('');
      }

      function milestoneOverview(task) {
        const overview = pickLocale(task.overview);
        if (overview.length <= 160) return overview;
        return `${overview.slice(0, 160)}…`;
      }

      function renderMilestoneFilters(index) {
        if (!milestoneTags) return;
        const counts = new Map();
        for (const task of index) {
          for (const rawTag of task.accepted_tags || []) {
            const tag = canonicalize(rawTag);
            if (!tag) continue;
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }
        const sorted = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).slice(0, 12);
        milestoneTags.innerHTML = sorted
          .map(([tag, count]) => {
            const label = translateTag(tag);
            return `<button class="hub-chip" data-tag="${tag}" aria-pressed="false"><span>${label}</span><span class="chip-count" aria-hidden="true">${count}</span></button>`;
          })
          .join('');
        milestoneTags.querySelectorAll('.hub-chip').forEach((btn) => {
          const tag = btn.dataset.tag;
          if (state.milestoneFilters.has(tag)) {
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          }
          btn.addEventListener('click', () => {
            const wasActive = state.milestoneFilters.has(tag);
            state.milestoneFilters.clear();
            milestoneTags.querySelectorAll('.hub-chip').forEach((chip) => {
              chip.classList.remove('active');
              chip.setAttribute('aria-pressed', 'false');
            });
            if (!wasActive) {
              state.milestoneFilters.add(tag);
              btn.classList.add('active');
              btn.setAttribute('aria-pressed', 'true');
            }
            renderMilestones();
          });
        });
      }

      function renderMilestones() {
        if (!milestoneList) return;
        if (state.loadingMilestones) return;
        if (!state.hasMilestoneData && state.milestonesIndex.length === 0) return;
        const query = (milestoneSearch?.value || '').trim().toLowerCase();
        const tags = Array.from(state.milestoneFilters);
        const filtered = state.milestonesIndex.filter((task) => {
          if (tags.length) {
            const set = new Set((task.accepted_tags || []).map((tag) => canonicalize(tag)));
            for (const tag of tags) {
              if (!set.has(tag)) return false;
            }
          }
          if (!query) return true;
          const blob = [task.task, pickLocale(task.display), pickLocale(task.overview), (task.accepted_tags || []).join(' ')].join(' ').toLowerCase();
          return blob.includes(query);
        });

        if (!filtered.length) {
          const msg = tr('paperhub_empty_milestone', {}, '没有匹配的任务，换个关键词试试。');
          milestoneList.innerHTML = `<div class="milestone-empty">${msg}</div>`;
          return;
        }

        const tagsLabel = tr('paperhub_chip_milestone_aria', {}, '任务标签过滤');

        milestoneList.innerHTML = filtered.map((task) => {
          const title = pickLocale(task.display) || task.task;
          const overview = milestoneOverview(task) || tr('paperhub_milestone_overview_fallback', {}, '尚未撰写概述，敬请期待。');
          const stats = Object.assign({ total: 0, frontier: 0, milestone: 0, bridge: 0, survey: 0 }, task.counts);
          const statsLines = [
            tr('paperhub_milestone_stat_total', { value: stats.total }, '条目：{value}'),
            tr('paperhub_milestone_stat_milestone', { value: stats.milestone }, '里程碑：{value}'),
            tr('paperhub_milestone_stat_bridge', { value: stats.bridge }, '过渡：{value}'),
            tr('paperhub_milestone_stat_frontier', { value: stats.frontier }, '前沿：{value}'),
            tr('paperhub_milestone_stat_survey', { value: stats.survey }, '综述：{value}')
          ].map((line) => `<span>${line}</span>`).join('');
          const updated = task.updated_at
            ? tr('paperhub_milestone_updated', { value: formatDate(task.updated_at) }, '更新：{value}')
            : tr('paperhub_milestone_updated_unknown', {}, '更新：—');
          const hasGraph = task.lineage_graph_hint
            ? tr('paperhub_milestone_graph_ready', {}, '演化线索：可视化')
            : tr('paperhub_milestone_graph_pending', {}, '演化线索：待整理');
          const tagsHtml = (task.accepted_tags || [])
            .map((tag) => {
              const canonicalTag = canonicalize(tag);
              return `<span class="milestone-tag" data-tag="${canonicalTag}">${translateTag(tag)}</span>`;
            })
            .join('');
          const tagsBlock = tagsHtml ? `<div class="milestone-tags" aria-label="${tagsLabel}">${tagsHtml}</div>` : '';

          return `
            <article class="hub-card milestone" data-slug="${task.slug}">
              <div class="milestone-header">
                <h3>${title}</h3>
                <p class="muted">${overview}</p>
                ${tagsBlock}
              </div>
              <div class="milestone-stats">
                ${statsLines}
                <span>${updated}</span>
                <span>${hasGraph}</span>
              </div>
              <div class="milestone-actions">
                <button class="milestone-toggle" data-action="toggle">${tr('paperhub_milestone_btn_expand', {}, '查看详情')}</button>
              </div>
              <div class="milestone-body" hidden></div>
            </article>`;
        }).join('');

        milestoneList.querySelectorAll('.milestone-toggle').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const card = btn.closest('.hub-card');
            const slug = card.dataset.slug;
            const body = card.querySelector('.milestone-body');
            const expanded = body.classList.contains('active');
            if (expanded) {
              body.classList.remove('active');
              body.hidden = true;
              btn.textContent = tr('paperhub_milestone_btn_expand', {}, '查看详情');
              return;
            }
            btn.disabled = true;
            btn.textContent = tr('paperhub_milestone_btn_loading', {}, '加载中…');
            try {
              const data = await loadMilestone(slug);
              body.innerHTML = renderMilestoneDetail(data);
              body.classList.add('active');
              body.hidden = false;
              btn.textContent = tr('paperhub_milestone_btn_collapse', {}, '收起');
            } catch (error) {
              body.innerHTML = `<div class="hub-error">${tr('paperhub_error_load_failed', { error: error.message }, '加载失败：{error}')}</div>`;
              body.classList.add('active');
              body.hidden = false;
              btn.textContent = tr('paperhub_milestone_btn_retry', {}, '重试');
            } finally {
              btn.disabled = false;
            }
          });
        });
      }

      function renderMilestoneDetail(data) {
        const phases = ['origin', 'milestone', 'bridge', 'frontier', 'survey'];
        const groups = phases.map((phase) => {
          const list = (data.items || []).filter((it) => it.phase === phase);
          if (!list.length) return '';
          const label = phaseLabels[phase] ? pickLocale(phaseLabels[phase]) : phase;
          const itemsHtml = list.map((item) => {
            const title = pickLocale(item.title_i18n) || item.title;
            const summary = pickLocale(item.summary_i18n) || item.rationale || tr('paperhub_no_summary', {}, '摘要即将上线，敬请期待。');
            const venue = [item.venue, item.year].filter(Boolean).join(' · ');
            const tags = (item.tags || [])
              .map((tag) => {
                const canonicalTag = canonicalize(tag);
                return `<span class="hub-tag" data-tag="${canonicalTag}">${translateTag(tag)}</span>`;
              })
              .join('');
            const links = [];
            if (item.links?.paper) links.push(`<a href="${item.links.paper}" target="_blank" rel="noopener">${tr('paperhub_link_paper', {}, '论文')} →</a>`);
            if (item.links?.code) links.push(`<a href="${item.links.code}" target="_blank" rel="noopener">${tr('paperhub_link_code', {}, '代码')} →</a>`);
            if (item.links?.project) links.push(`<a href="${item.links.project}" target="_blank" rel="noopener">${tr('paperhub_link_project', {}, '项目')} →</a>`);
            if (item.links?.pdf && item.links.pdf !== item.links.paper) links.push(`<a href="${item.links.pdf}" target="_blank" rel="noopener">${tr('paperhub_link_pdf', {}, 'PDF')} →</a>`);
            const lineage = [];
            if (item.lineage?.prev?.length) lineage.push(tr('paperhub_lineage_prev', { list: item.lineage.prev.join(', ') }, '前驱：{list}'));
            if (item.lineage?.next?.length) lineage.push(tr('paperhub_lineage_next', { list: item.lineage.next.join(', ') }, '后继：{list}'));
            const badges = [];
            badges.push(`<span class="badge">${label}</span>`);
            if (item.auto_injected) badges.push(`<span class="badge">${tr('paperhub_badge_auto', {}, '⚡ 自动')}</span>`);
            if (item.importance_score) badges.push(`<span class="badge">${tr('paperhub_badge_score', {}, '评分')} ${item.importance_score}</span>`);
            return `
              <article class="milestone-item">
                <header>
                  <h5>${title}</h5>
                  <div class="meta">
                    ${badges.join(' ')}
                    <span>${venue || ''}</span>
                  </div>
                </header>
                <p class="summary">${summary}</p>
                <div class="hub-tags">${tags}</div>
                <div class="hub-links">${links.join('')}</div>
                ${lineage.length ? `<div class="meta">${lineage.join(' · ')}</div>` : ''}
              </article>`;
          }).join('');
          return `<section class="milestone-phase"><h4>${label}</h4><div class="milestone-list">${itemsHtml}</div></section>`;
        }).filter(Boolean).join('');
        return groups || `<div class="milestone-empty">${tr('paperhub_milestone_empty_detail', {}, '尚未整理该任务的里程碑。')}</div>`;
      }

      async function loadMilestone(slug) {
        if (state.milestoneCache.has(slug)) return state.milestoneCache.get(slug);
        const url = `${DATA_BASE}/data/ai/scholarpush/milestones/tasks/${slug}.json`;
        const data = await fetchJSON(url);
        state.milestoneCache.set(slug, data);
        return data;
      }

      function switchTab(target) {
        const tab = target.dataset.tab;
        if (!tab || !panels[tab]) return;
        tabButtons.forEach((btn) => {
          const isActive = btn === target;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', String(isActive));
        });
        Object.entries(panels).forEach(([key, panel]) => {
          const isActive = key === tab;
          panel.classList.toggle('active', isActive);
          panel.hidden = !isActive;
        });
      }

      tabButtons.forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn));
      });

      if (highlightSearch) {
        highlightSearch.addEventListener('input', () => {
          renderHighlights();
        });
      }

      if (milestoneSearch) {
        milestoneSearch.addEventListener('input', () => {
          renderMilestones();
        });
      }

      syncStaticText();

      async function init() {
        if (highlightList) {
          highlightList.innerHTML = `<div class="hub-loading">${tr('paperhub_loading_highlights', {}, '加载今日精选...')}</div>`;
        }
        if (milestoneList) {
          milestoneList.innerHTML = `<div class="hub-loading">${tr('paperhub_loading_milestones', {}, '加载任务索引...')}</div>`;
        }
        state.loadingHighlights = true;
        state.loadingMilestones = true;
        try {
          const [alias, highlights, milestoneIndex] = await Promise.all([
            fetchJSON(TAG_ALIAS_URL).catch(() => []),
            fetchJSON(HIGHLIGHTS_URL),
            fetchJSON(MILESTONE_INDEX_URL)
          ]);
          state.aliasMap = buildAliasMap(alias);
          state.highlights = Array.isArray(highlights.items) ? highlights.items : [];
          state.milestonesIndex = Array.isArray(milestoneIndex.tasks) ? milestoneIndex.tasks : [];
          state.loadingHighlights = false;
          state.loadingMilestones = false;
          state.hasHighlightData = true;
          state.hasMilestoneData = true;
          renderHighlightChips(state.highlights);
          renderHighlights();
          renderMilestoneFilters(state.milestonesIndex);
          renderMilestones();
        } catch (error) {
          state.loadingHighlights = false;
          state.loadingMilestones = false;
          state.hasHighlightData = false;
          state.hasMilestoneData = false;
          const message = tr('paperhub_error_load_failed', { error: error.message }, '加载失败：{error}');
          if (highlightList) highlightList.innerHTML = `<div class="hub-error">${message}</div>`;
          if (milestoneList) milestoneList.innerHTML = `<div class="hub-error">${message}</div>`;
        }
      }

      init();

      window.addEventListener('language-changed', () => {
        syncStaticText();
        if (state.hasHighlightData) {
          renderHighlightChips(state.highlights);
        }
        if (state.hasMilestoneData) {
          renderMilestoneFilters(state.milestonesIndex);
        }
        renderHighlights();
        renderMilestones();
      });
    })();
  </script>
</body>
</html>
