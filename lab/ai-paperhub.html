  <script>
    (function(){
      try {
        var root = document.documentElement;
        if (!root) return;
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) { saved = null; }
        var hasManual = saved === 'light' || saved === 'dark';
        if (!hasManual && saved) {
          try { localStorage.removeItem('theme'); } catch (e2) {}
        }
        var prefersDark = false;
        try {
          prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e3) { prefersDark = false; }
        var theme = hasManual ? saved : (prefersDark ? 'dark' : 'light');
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-mode', hasManual ? theme : ('system-' + theme));
        root.setAttribute('data-theme-source', hasManual ? 'user' : 'system');
      } catch(e){}
    })();

    .hub-container { max-width: 1120px; margin: 0 auto; padding: 0 16px 80px; }
  .hub-tabbar { display: flex; gap: 12px; padding: 10px 14px; border-radius: 16px; background: var(--hub-surface); box-shadow: var(--hub-shadow); margin-bottom: 24px; flex-wrap: wrap; justify-content: flex-start; align-items: center; }

  .hub-tabbar .tab-btn { border: 1px solid transparent; background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(245,248,255,0.94)); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 15.5px; color: color-mix(in oklab, var(--text, #0f172a), var(--hub-primary) 18%); cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease; box-shadow: 0 6px 18px -12px rgba(30,74,220,0.06); }
  .hub-tabbar .tab-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -18px rgba(30,74,220,0.12); }
  .hub-tabbar .tab-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px color-mix(in oklab, var(--hub-primary), transparent 72%); }
  .hub-tabbar .tab-btn[aria-selected="true"] { background: linear-gradient(180deg, var(--hub-primary), color-mix(in oklab, var(--hub-primary-strong), rgba(255,255,255,0.06) 20%)); color: #fff; border-color: color-mix(in oklab, var(--hub-primary-strong), rgba(255,255,255,0.28) 40%); box-shadow: 0 18px 40px -26px rgba(28,63,180,0.36); transform: translateY(-1px); }

    .hub-panel { display: none; }

    .hub-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  .hub-toolbar .input { min-width: 240px; height: 40px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--hub-input-border); background: var(--hub-input-bg); color: var(--hub-text-body); box-shadow: 0 14px 32px -26px rgba(46,106,242,0.22); transition: border-color 0.18s ease, box-shadow 0.18s ease; }
  .hub-toolbar .input:focus-visible { border-color: var(--hub-primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--hub-primary), transparent 55%); outline: none; }

    /* Make the highlights search adaptive: let it grow to occupy available toolbar space
       while keeping a sensible minimum width so date-nav stays visible. This ensures the
       search doesn't appear too short on narrow/wide screens. */
    .hub-toolbar #highlight-search {
      flex: 1 1 auto;
      min-width: 140px;
      max-width: 100%;
      width: auto;
      box-sizing: border-box;
    }
    .hub-toolbar #milestone-search {
      flex: 1 1 auto;
      min-width: 140px;
      max-width: 100%;
      width: auto;
      box-sizing: border-box;
    }

  /* Date picker inside hub toolbar to choose which day's highlights to show */
  /* Positioned to the right of the search input (not auto-aligned to the far right) */
  .hub-date-nav {
    margin-left: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px;
    border-radius: 14px;
    background: var(--hub-card-bg-soft);
    box-shadow: 0 6px 20px -8px rgba(46,106,242,0.06);
  }
  .hub-date-nav .btn {
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-weight: 700;
    color: var(--hub-button-text);
    border: 1px solid color-mix(in oklab, var(--hub-primary), rgba(255,255,255,0.7) 32%);
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,248,255,0.95));
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
  }
  /* Page now uses global utility class `.date-nav--mirrored` in style.css to
    control mirrored margins for date nav buttons. */
  .hub-date-nav .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -14px rgba(32, 74, 220, 0.12); }
  .hub-date-nav .btn:focus-visible { outline: 3px solid color-mix(in oklab, var(--hub-primary), rgba(255,255,255,0.6) 36%); outline-offset: 2px; }
  .hub-date-nav .input {
    min-width: 220px;
    height: 44px;
    padding: 8px 12px 8px 16px;
    border-radius: 12px;
    border: 1px solid color-mix(in oklab, var(--hub-border), rgba(76,111,247,0.08));
    background: var(--hub-input-bg);
    color: var(--hub-text-strong);
    text-align: center;
    font-weight: 600;
    box-shadow: 0 8px 20px -12px rgba(46,106,242,0.09);
  }
  /* make the native date picker indicator look slightly nicer in WebKit/Blink */
  .hub-date-nav input[type="date"]::-webkit-calendar-picker-indicator {
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.6)) drop-shadow(0 2px 8px rgba(46,106,242,0.06));
    color: var(--hub-primary-strong);
    opacity: 0.98;

  .hub-date-nav .input:focus-visible { outline: none; box-shadow: 0 0 0 4px color-mix(in oklab, var(--hub-primary), transparent 68%); }
  @media (max-width: 520px) {

    .hub-date-nav .btn:last-child { margin: 0; }

  .hub-chiprow { display: flex; gap: 8px; flex-wrap: wrap; }

  .hub-chip .chip-count { padding: 3px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: color-mix(in oklab, rgba(255,255,255,0.65), rgba(47,219,255,0.25) 35%); color: color-mix(in oklab, var(--hub-primary), var(--hub-text-strong) 30%); line-height: 1.2; }

      const TAG_LABELS_LOWER = new Map(
        Object.entries(TAG_LABELS).map(([key, value]) => [key.toLowerCase(), value])
      );

      const state = {
        aliasMap: new Map(),
        highlights: [],
        allHighlights: [], // Global search data
        dateCache: new Map(),
        showingPerDay: null,
        availableDates: new Set(),
        highlightFilters: new Set(),

        hasMilestoneData: false
      };

      function getLang() {
        return document.documentElement.lang || localStorage.getItem('lang') || 'zh';
      }

      function tRaw(key) {
        const lang = getLang();
        return window.translations?.[lang]?.[key] ?? window.translations?.en?.[key] ?? '';
      }

      function tr(key, replacements = {}, fallback = '') {
        let text = tRaw(key);
        if (!text) text = fallback;
        if (!text) return '';
        for (const [token, value] of Object.entries(replacements)) {
          text = text.replace(new RegExp(`\\{${token}\\}`, 'g'), value);
        }
        return text;
      }

      function pickLocale(map) {
        if (!map) return '';
        const lang = getLang();
        return map[lang] || map.en || map.zh || map.es || '';
      }

      function formatDate(iso) {
        if (!iso) return '';
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return '';
        return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')}`;
      }

      // format a Date object as local yyyy-mm-dd (for input[type=date] value)
      function toLocalYYYYMMDD(d) {
        if (!d) return '';
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }

      // parse yyyy-mm-dd from input into a Date (local timezone)
      function fromInputDate(value) {
        if (!value) return null;
        const parts = value.split('-').map(Number);
        if (parts.length !== 3) return null;
        // create Date in local timezone
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function buildAliasMap(entries) {
        const map = new Map();
        for (const entry of entries || []) {
          const canonical = String(entry.canonical || '').trim();
          if (!canonical) continue;
          map.set(canonical.toLowerCase(), canonical);
          for (const alias of entry.aliases || []) {
            const key = String(alias || '').trim().toLowerCase();
            if (!key) continue;
            if (!map.has(key)) map.set(key, canonical);
          }
        }
        return map;
      }

      async function loadAllHighlights(dates) {
        const allItems = [];
        const promises = dates.map(async (date) => {
          try {
            const url = `${DATA_BASE}/data/ai/scholarpush/${date}.json`;
            const data = await fetchJSON(url);
            const items = Array.isArray(data.items) ? data.items : (Array.isArray(data) ? data : []);
            allItems.push(...items);
          } catch (err) {
            // Skip failed dates
            console.warn(`Failed to load ${date}:`, err);
          }
        });
        await Promise.all(promises);
        return allItems;
      }

      function canonicalize(tag) {
        const key = String(tag || '').trim();
        if (!key) return '';
        const canonical = state.aliasMap.get(key.toLowerCase());
        return canonical || key;
      }

      function translateTag(tag) {
        const raw = String(tag || '').trim();
        if (!raw) return '';
        const canonical = canonicalize(raw);
        const candidates = [canonical, raw];
        let record = null;
        for (const key of candidates) {
          if (key && TAG_LABELS[key]) {
            record = TAG_LABELS[key];
            break;
          }
        }
        if (!record) {
          const lowerCandidates = candidates
            .filter(Boolean)
            .map((key) => key.toLowerCase());
          for (const lower of lowerCandidates) {
            if (TAG_LABELS_LOWER.has(lower)) {
              record = TAG_LABELS_LOWER.get(lower);
              break;
            }
          }
        }
        if (!record) return canonical || raw;
        const lang = getLang();
        return record[lang] || record.en || record.zh || record.es || canonical || raw;
      }

      function fetchJSON(url) {
        return fetch(url, { cache: 'no-cache' }).then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        });
      }

      function syncStaticText() {
        if (highlightSearch) {
          highlightSearch.setAttribute('placeholder', tr('paperhub_search_highlight_placeholder', {}, '搜索标题、标签或摘要'));

          milestoneSearch.setAttribute('placeholder', tr('paperhub_search_milestone_placeholder', {}, '搜索任务、关键字'));

      }

      function renderHighlightStats(items, isSearching = false) {
        if (!highlightStats) return;
        if (!items.length) {
          highlightStats.innerHTML = '';
          return;
        }
        const total = items.length;
        const withCode = items.filter((it) => it.has_code).length;
        const avgImpact = Math.round(items.reduce((sum, it) => sum + (Number(it.impact_score) || 0), 0) / total);
        // For global search, compute time span from all items
        const timeSpan = items.reduce((acc, it) => {
          const time = new Date(it.ts || it.date || it.generated_at || '');
          if (Number.isNaN(time.getTime())) return acc;
          const iso = time.toISOString();
          if (!acc.min || iso < acc.min) acc.min = iso;
          if (!acc.max || iso > acc.max) acc.max = iso;
          return acc;
        }, { min: null, max: null });

        const formattedMin = timeSpan.min ? formatDate(timeSpan.min) : '';
        const formattedMax = timeSpan.max ? formatDate(timeSpan.max) : '';
        let spanText = '';
        if (formattedMin && formattedMax) {
          spanText = formattedMin === formattedMax
            ? formattedMin
            : `${formattedMin} → ${formattedMax}`;
        } else {
          spanText = formattedMin || formattedMax || '';
        }

        const codeCaption = tr('paperhub_stat_code_caption', { count: withCode }, '{count} 篇附带代码仓库');
        const totalLabel = isSearching ? tr('paperhub_stat_search_total_label', {}, '搜索结果数量') : tr('paperhub_stat_highlight_label', {}, '今日精选数量');

        highlightStats.innerHTML = `
          <article class="hub-stat">
            <span>${totalLabel}</span>
            <h4>${total}</h4>
            <span>${tr('paperhub_stat_highlight_caption', {}, '记录的论文条目')}</span>
          </article>
          <article class="hub-stat">
            <span>${tr('paperhub_stat_impact_label', {}, '平均影响评分')}</span>
            <h4>${Number.isNaN(avgImpact) ? '—' : avgImpact}</h4>
            <span>${tr('paperhub_stat_impact_caption', {}, 'Impact Score (0-100)')}</span>
          </article>
          <article class="hub-stat">
            <span>${tr('paperhub_stat_code_label', {}, '含代码比例')}</span>
            <h4>${total ? Math.round((withCode / total) * 100) : 0}%</h4>
            <span>${codeCaption}</span>
          </article>
          <article class="hub-stat">
            <span>${tr('paperhub_stat_range_label', {}, '收录时间范围')}</span>

            <span>${tr('paperhub_stat_range_caption', {}, '按最新 JSON 统计')}</span>
          </article>`;
      }

      function highlightTitle(item) {
        return pickLocale(item.title_i18n) || item.headline || item.title || '';
      }

      function highlightSummary(item) {
        const preferred = pickLocale(item.summary_i18n);
        if (preferred) return preferred;
        const lang = getLang();
        if (lang === 'zh') return item.quick_read || item.one_liner || '';
        if (lang === 'en') return (item.summary_i18n && item.summary_i18n.en) || item.one_liner || '';
        if (lang === 'es') return (item.summary_i18n && item.summary_i18n.es) || item.one_liner || '';
        return item.one_liner || '';
      }

      function renderHighlightChips(items) {
        if (!highlightChips) return;
        const counts = new Map();
        for (const item of state.allHighlights) {
          const set = new Set();
          const tags = (item.tags || []).map(canonicalize);
          tags.forEach((tag) => { if (tag) set.add(tag); });
          if (item.task) set.add(canonicalize(item.task));
          for (const tag of set) {
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }
        const sorted = Array.from(counts.entries())
          .filter(([tag]) => tag && tag.toUpperCase() !== 'N/A')
          .sort((a, b) => b[1] - a[1])
          .slice(0, 12);
        highlightChips.innerHTML = sorted
          .map(([tag, count]) => {
            const label = translateTag(tag);
            return `<button class="hub-chip" data-tag="${tag}" aria-pressed="false"><span>${label}</span><span class="chip-count" aria-hidden="true">${count}</span></button>`;
          })
          .join('');
        highlightChips.querySelectorAll('.hub-chip').forEach((btn) => {
          const tag = btn.dataset.tag;
          if (state.highlightFilters.has(tag)) {
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          }
          btn.addEventListener('click', () => {
            const wasActive = state.highlightFilters.has(tag);
            state.highlightFilters.clear();
            highlightChips.querySelectorAll('.hub-chip').forEach((chip) => {
              chip.classList.remove('active');
              chip.setAttribute('aria-pressed', 'false');
            });
            if (!wasActive) {
              state.highlightFilters.add(tag);
              btn.classList.add('active');
              btn.setAttribute('aria-pressed', 'true');
            }
            renderHighlights();
          });
        });
      }

      // initialize date picker to the newest highlight date or today
      function initSelectedDate() {
        if (!highlightDateInput) return;
        // If dates.json is available, pick the latest date listed there (strings are ISO yyyy-mm-dd so lexicographic max works)
        const avail = Array.from(state.availableDates || []);
        if (avail.length) {
          avail.sort();
          const latestKey = avail[avail.length - 1];
          highlightDateInput.value = latestKey;
          return;
        }
        // fallback: choose latest ts from loaded highlights (UTC) and convert to local date
        const dates = state.highlights
          .map((it) => it.ts || it.date || it.generated_at)
          .map((s) => s ? new Date(s) : null)
          .filter(Boolean)
          .map((d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()));
        const latest = dates.length ? new Date(Math.max(...dates.map((d) => d.getTime()))) : new Date();
        highlightDateInput.value = toLocalYYYYMMDD(latest);
      }

      // produce yyyy-mm-dd string from Date or input value
      function normalizeDateValue(valueOrDate) {
        if (!valueOrDate) return null;
        if (valueOrDate instanceof Date) return toLocalYYYYMMDD(valueOrDate);
        // assume string like yyyy-mm-dd
        return String(valueOrDate).slice(0, 10);
      }

      // load per-day highlights JSON file (e.g. /data/ai/scholarpush/2025-10-06.json)
      async function loadHighlightsForDate(valueOrDate) {
        if (!highlightDateInput) return;
        const dateKey = normalizeDateValue(valueOrDate || highlightDateInput.value);
        if (!dateKey) {
          state.highlights = [];
          renderHighlightChips(state.highlights);
          renderHighlights();
          return;
        }
        // cached?
        if (state.dateCache.has(dateKey)) {
            state.highlights = state.dateCache.get(dateKey) || [];
            // mark that we're showing a per-day dataset (even if empty)
            state.showingPerDay = dateKey;
            // clear any active chip filters so the per-day view shows its full set
            state.highlightFilters.clear();
            renderHighlightChips(state.highlights);
            renderHighlights();
          return;
        }
        // fetch per-day file under DATA_BASE/data/ai/scholarpush/${dateKey}.json
        const url = `${DATA_BASE}/data/ai/scholarpush/${dateKey}.json`;
        try {
          const data = await fetchJSON(url);
          const items = Array.isArray(data.items) ? data.items : (Array.isArray(data) ? data : []);
          state.dateCache.set(dateKey, items);
          state.highlights = items;
          // mark that we are now displaying a per-day dataset
          state.showingPerDay = dateKey;
          // clear any active chip filters so the per-day view shows its full set
          state.highlightFilters.clear();
          renderHighlightChips(state.highlights);
          renderHighlights();
        } catch (err) {
          // treat missing/404 as empty for that date; show friendly message
          state.dateCache.set(dateKey, []);
          state.highlights = [];
          state.showingPerDay = dateKey;
          state.highlightFilters.clear();
          renderHighlightChips(state.highlights);
          renderHighlights();
        }
      }

      function shiftSelectedDate(days) {
        if (!highlightDateInput) return;

        const cur = fromInputDate(highlightDateInput.value) || new Date();
        cur.setDate(cur.getDate() + days);
        highlightDateInput.value = toLocalYYYYMMDD(cur);
        // load per-day file for the new date
        loadHighlightsForDate(cur);
      }

      if (highlightPrevBtn) {
        highlightPrevBtn.addEventListener('click', () => {
          if (highlightDateInput) highlightDateInput.dataset.userSelected = 'true';
          shiftSelectedDate(-1);
        });
      }
      if (highlightNextBtn) {
        highlightNextBtn.addEventListener('click', () => {
          if (highlightDateInput) highlightDateInput.dataset.userSelected = 'true';
          shiftSelectedDate(1);
        });
      }
      if (highlightDateInput) {
        // only mark as user-selected when the user interacts with the control
        highlightDateInput.addEventListener('change', () => {
          highlightDateInput.dataset.userSelected = 'true';
          loadHighlightsForDate(highlightDateInput.value);
        });
        // ensure default flag is false on initial load
        highlightDateInput.dataset.userSelected = 'false';
      }

      

      function formatBadge(item) {
        const badges = [];
        if (item.impact_score) {
          badges.push(`<span class="badge" title="${tr('paperhub_badge_impact_title', {}, 'Impact Score')}">${tr('paperhub_badge_impact', {}, 'Impact')} ${item.impact_score}</span>`);
        }
        if (item.reproducibility_score) {
          badges.push(`<span class="badge" title="${tr('paperhub_badge_repro_title', {}, 'Reproducibility Score')}">${tr('paperhub_badge_repro', {}, 'Repro')} ${item.reproducibility_score}</span>`);
        }
        if (item.has_code) {
          badges.push(`<span class="badge" title="${tr('paperhub_badge_code_title', {}, 'Has code repository')}">${tr('paperhub_badge_code', {}, 'Code')}</span>`);
        }
        return badges.join(' ');
      }

      function bestLink(item) {
        const links = item.links || {};
        if (links.paper && links.paper !== 'N/A') return { label: tr('paperhub_link_paper', {}, '论文'), url: links.paper };
        if (links.project && links.project !== 'N/A') return { label: tr('paperhub_link_project', {}, '项目'), url: links.project };
        if (links.code && links.code !== 'N/A') return { label: tr('paperhub_link_code', {}, '代码'), url: links.code };
        if (links.pdf && links.pdf !== 'N/A') return { label: tr('paperhub_link_pdf', {}, 'PDF'), url: links.pdf };
        return null;
      }

      function renderHighlights() {
        if (!highlightList) return;
        if (state.loadingHighlights) return;
        if (!state.hasHighlightData && state.allHighlights.length === 0) return;
        if (highlightEmpty) {
          highlightEmpty.textContent = tr('paperhub_empty_highlight', {}, '没有匹配的论文，换个关键词试试。');
        }
        const query = (highlightSearch?.value || '').trim().toLowerCase();
        const tags = Array.from(state.highlightFilters);
        const isSearching = query || tags.length > 0;

        let dataToFilter;
        if (isSearching) {
          // When searching or filtering, use all data
          dataToFilter = state.allHighlights;
        } else {
          // When no search/filter, show latest date data
          dataToFilter = state.highlights;
        }

        const filtered = dataToFilter.filter((item) => {
          if (tags.length) {
            const itemTags = new Set((item.tags || []).map(canonicalize));
            if (item.task) itemTags.add(canonicalize(item.task));
            const hasAll = tags.every((tag) => itemTags.has(tag));
            if (!hasAll) return false;
          }
          if (!query) return true;
          const blob = [highlightTitle(item), highlightSummary(item), (item.tags || []).join(' '), item.task || '', item.type || '']
            .join(' ')
            .toLowerCase();
          return blob.includes(query);
        });

        renderHighlightStats(filtered, isSearching);
        const hasItems = filtered.length > 0;
        if (highlightEmpty) highlightEmpty.hidden = hasItems;
        if (!hasItems) {
          highlightList.innerHTML = '';
          return;
        }
        highlightList.innerHTML = filtered
          .map((item) => {
            const title = highlightTitle(item);
            const summary = highlightSummary(item) || tr('paperhub_no_summary', {}, '摘要即将上线，敬请期待。');
            const metaParts = [];
            if (item.task) metaParts.push(translateTag(item.task));
            if (item.type) metaParts.push(item.type);
            if (item.host) metaParts.push(item.host.replace(/^https?:\/\//, ''));
            const ts = formatDate(item.ts || item.date || item.generated_at || '');
            if (ts) metaParts.push(ts);
            const link = bestLink(item);
            const tagsHtml = (item.tags || [])
              .map(canonicalize)
              .filter((tag) => tag && tag.toUpperCase() !== 'N/A')
              .map((tag) => `<span class="hub-tag" data-tag="${tag}">${translateTag(tag)}</span>`)
              .join('');
            const kn = (item.key_numbers_compact || [])
              .map((badge) => `<span class="hub-tag">${badge}</span>`)
              .join('');
            const badges = formatBadge(item);
            return `
              <article class="hub-card" data-id="${item.id || ''}">
                <div class="hub-meta">
                  ${badges}
                </div>
                <h3 class="hub-title">${title}</h3>
                <p class="hub-summary">${summary}</p>
                <div class="hub-meta">
                  ${metaParts.join(' · ')}
                </div>
                <div class="hub-tags">${tagsHtml}${kn}</div>
                <div class="hub-links">
                  ${link ? `<a href="${link.url}" target="_blank" rel="noopener">${link.label} →</a>` : ''}
                  ${(item.links && item.links.code && item.links.code !== 'N/A') ? `<a href="${item.links.code}" target="_blank" rel="noopener">${tr('paperhub_link_code', {}, '代码')} →</a>` : ''}
                </div>
              </article>`;
          })
          .join('');
      }

      function milestoneOverview(task) {
        const overview = pickLocale(task.overview);
        if (overview.length <= 160) return overview;
        return `${overview.slice(0, 160)}…`;
      }

      function renderMilestoneFilters(index) {
        if (!milestoneTags) return;
        const counts = new Map();
        for (const task of index) {
          for (const rawTag of task.accepted_tags || []) {
            const tag = canonicalize(rawTag);
            if (!tag) continue;
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }
        const sorted = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).slice(0, 12);
        milestoneTags.innerHTML = sorted
          .map(([tag, count]) => {
            const label = translateTag(tag);
            return `<button class="hub-chip" data-tag="${tag}" aria-pressed="false"><span>${label}</span><span class="chip-count" aria-hidden="true">${count}</span></button>`;
          })
          .join('');
        milestoneTags.querySelectorAll('.hub-chip').forEach((btn) => {
          const tag = btn.dataset.tag;
          if (state.milestoneFilters.has(tag)) {
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          }
          btn.addEventListener('click', () => {
            const wasActive = state.milestoneFilters.has(tag);
            state.milestoneFilters.clear();
            milestoneTags.querySelectorAll('.hub-chip').forEach((chip) => {
              chip.classList.remove('active');
              chip.setAttribute('aria-pressed', 'false');
            });
            if (!wasActive) {
              state.milestoneFilters.add(tag);
              btn.classList.add('active');
              btn.setAttribute('aria-pressed', 'true');
            }
            renderMilestones();
          });
        });
      }

      function renderMilestones() {
        if (!milestoneList) return;
        if (state.loadingMilestones) return;
        if (!state.hasMilestoneData && state.milestonesIndex.length === 0) return;
        const query = (milestoneSearch?.value || '').trim().toLowerCase();
        const tags = Array.from(state.milestoneFilters);
        const filtered = state.milestonesIndex.filter((task) => {
          if (tags.length) {
            const set = new Set((task.accepted_tags || []).map((tag) => canonicalize(tag)));
            for (const tag of tags) {
              if (!set.has(tag)) return false;
            }
          }
          if (!query) return true;
          const blob = [task.task, pickLocale(task.display), pickLocale(task.overview), (task.accepted_tags || []).join(' ')].join(' ').toLowerCase();
          return blob.includes(query);
        });

        if (!filtered.length) {
          const msg = tr('paperhub_empty_milestone', {}, '没有匹配的任务，换个关键词试试。');
          milestoneList.innerHTML = `<div class="milestone-empty">${msg}</div>`;
          return;
        }

        const tagsLabel = tr('paperhub_chip_milestone_aria', {}, '任务标签过滤');

        milestoneList.innerHTML = filtered.map((task) => {
          const title = pickLocale(task.display) || task.task;
          const overview = milestoneOverview(task) || tr('paperhub_milestone_overview_fallback', {}, '尚未撰写概述，敬请期待。');
          const stats = Object.assign({ total: 0, frontier: 0, milestone: 0, bridge: 0, survey: 0 }, task.counts);
          const statsLines = [
            tr('paperhub_milestone_stat_total', { value: stats.total }, '条目：{value}'),
            tr('paperhub_milestone_stat_milestone', { value: stats.milestone }, '里程碑：{value}'),
            tr('paperhub_milestone_stat_bridge', { value: stats.bridge }, '过渡：{value}'),
            tr('paperhub_milestone_stat_frontier', { value: stats.frontier }, '前沿：{value}'),
            tr('paperhub_milestone_stat_survey', { value: stats.survey }, '综述：{value}')
          ].map((line) => `<span>${line}</span>`).join('');
          const updated = task.updated_at
            ? tr('paperhub_milestone_updated', { value: formatDate(task.updated_at) }, '更新：{value}')
            : tr('paperhub_milestone_updated_unknown', {}, '更新：—');
          const tagsHtml = (task.accepted_tags || [])
            .map((tag) => {
              const canonicalTag = canonicalize(tag);
              return `<span class="milestone-tag" data-tag="${canonicalTag}">${translateTag(tag)}</span>`;
            })
            .join('');
          const tagsBlock = tagsHtml ? `<div class="milestone-tags" aria-label="${tagsLabel}">${tagsHtml}</div>` : '';

          return `
            <article class="hub-card milestone" data-slug="${task.slug}">
              <div class="milestone-header">
                <h3>${title}</h3>
                <p class="muted">${overview}</p>
                ${tagsBlock}
              </div>
              <div class="milestone-stats">
                ${statsLines}
                <span>${updated}</span>
              </div>
              <div class="milestone-actions">
                <button class="milestone-toggle" data-action="toggle">${tr('paperhub_milestone_btn_expand', {}, '查看详情')}</button>
              </div>
              <div class="milestone-body" hidden></div>
            </article>`;
        }).join('');

        milestoneList.querySelectorAll('.milestone-toggle').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const card = btn.closest('.hub-card');
            const slug = card.dataset.slug;
            const body = card.querySelector('.milestone-body');
            const expanded = body.classList.contains('active');
            if (expanded) {
              body.classList.remove('active');
              body.hidden = true;
              // remove any positioned tail when collapsed
              body.querySelectorAll('.segment-tail').forEach((el) => el.remove());
              btn.textContent = tr('paperhub_milestone_btn_expand', {}, '查看详情');
              return;
            }
            btn.disabled = true;
            btn.textContent = tr('paperhub_milestone_btn_loading', {}, '加载中…');
            try {
              const data = await loadMilestone(slug);
              body.innerHTML = renderMilestoneDetail(data);
              body.classList.add('active');
              body.hidden = false;
              // position the final-phase tail after the DOM has rendered
              requestAnimationFrame(() => {
                positionFinalPhaseTail();
                // a second pass to ensure sizes after webfonts/paint
                setTimeout(positionFinalPhaseTail, 120);
              });
              btn.textContent = tr('paperhub_milestone_btn_collapse', {}, '收起');
              const collapseBtnEl = body.querySelector('.collapse-btn');
              if (collapseBtnEl) {
                collapseBtnEl.addEventListener('click', () => {
                  const card = btn.closest('.hub-card');
                  if (!card) return;
                  body.classList.remove('active');
                  body.hidden = true;
                  // remove any positioned tail when collapsed
                  body.querySelectorAll('.segment-tail').forEach((el) => el.remove());
                  btn.textContent = tr('paperhub_milestone_btn_expand', {}, '查看详情');

                  requestAnimationFrame(() => {
                    const docStyle = getComputedStyle(document.documentElement);
                    const parsedPadding = parseFloat(docStyle.scrollPaddingTop || '0');
                    const scrollPadding = Number.isNaN(parsedPadding) ? 0 : parsedPadding;
                    let offset = scrollPadding;
                    const header = document.querySelector('header');
                    if (header) {
                      const hs = getComputedStyle(header);
                      if (hs.position === 'fixed' || hs.position === 'sticky') {
                        offset = Math.max(offset, header.offsetHeight || 0);
                      }
                    }
                    const desiredTop = offset + 12; // 让卡片顶部露出一些呼吸空间
                    const endRect = card.getBoundingClientRect();
                    const shift = endRect.top - desiredTop;
                    if (Math.abs(shift) > 1) {
                      window.scrollBy({ top: shift, behavior: 'auto' });
                    }
                    requestAnimationFrame(() => {
                      const finalRect = card.getBoundingClientRect();
                      const correction = finalRect.top - desiredTop;
                      if (Math.abs(correction) > 1) {
                        window.scrollBy({ top: correction, behavior: 'smooth' });
                      }
                      if (typeof btn.focus === 'function') {
                        btn.focus({ preventScroll: true });
                      }
                    });
                  });
                });
              }
            } catch (error) {
              body.innerHTML = `<div class="hub-error">${tr('paperhub_error_load_failed', { error: error.message }, '加载失败：{error}')}</div>`;
              body.classList.add('active');
              body.hidden = false;
              btn.textContent = tr('paperhub_milestone_btn_retry', {}, '重试');
            } finally {
              btn.disabled = false;
            }
          });
        });
      }

      function renderMilestoneDetail(data) {
        const phases = ['origin', 'milestone', 'bridge', 'frontier', 'survey'];
        const groups = phases.map((phase) => {
          const list = (data.items || []).filter((it) => it.phase === phase);
          if (!list.length) return '';
          const label = phaseLabels[phase] ? pickLocale(phaseLabels[phase]) : phase;
          const itemsHtml = list.map((item) => {
            const title = pickLocale(item.title_i18n) || item.title;
            const summary = pickLocale(item.summary_i18n) || item.rationale || tr('paperhub_no_summary', {}, '摘要即将上线，敬请期待。');
            const venue = [item.venue, item.year].filter(Boolean).join(' · ');
            const tags = (item.tags || [])
              .map((tag) => {
                const canonicalTag = canonicalize(tag);
                return `<span class="hub-tag" data-tag="${canonicalTag}">${translateTag(tag)}</span>`;
              })
              .join('');
            const links = [];
            if (item.links?.paper) links.push(`<a href="${item.links.paper}" target="_blank" rel="noopener">${tr('paperhub_link_paper', {}, '论文')} →</a>`);
            if (item.links?.code) links.push(`<a href="${item.links.code}" target="_blank" rel="noopener">${tr('paperhub_link_code', {}, '代码')} →</a>`);
            if (item.links?.project) links.push(`<a href="${item.links.project}" target="_blank" rel="noopener">${tr('paperhub_link_project', {}, '项目')} →</a>`);
            if (item.links?.pdf && item.links.pdf !== item.links.paper) links.push(`<a href="${item.links.pdf}" target="_blank" rel="noopener">${tr('paperhub_link_pdf', {}, 'PDF')} →</a>`);
            const lineage = [];
            if (item.lineage?.prev?.length) lineage.push(tr('paperhub_lineage_prev', { list: item.lineage.prev.join(', ') }, '前驱：{list}'));
            if (item.lineage?.next?.length) lineage.push(tr('paperhub_lineage_next', { list: item.lineage.next.join(', ') }, '后继：{list}'));
            const badges = [];
            badges.push(`<span class="badge">${label}</span>`);
            if (item.auto_injected) badges.push(`<span class="badge">${tr('paperhub_badge_auto', {}, '⚡ 自动')}</span>`);
            if (item.importance_score) badges.push(`<span class="badge">${tr('paperhub_badge_score', {}, '评分')} ${item.importance_score}</span>`);
            return `
              <article class="milestone-item">
                <header>
                  <h5>${title}</h5>
                  <div class="meta">
                    ${badges.join(' ')}
                    <span>${venue || ''}</span>
                  </div>
                </header>
                <p class="summary">${summary}</p>
                <div class="hub-tags">${tags}</div>
                <div class="hub-links">${links.join('')}</div>
                ${lineage.length ? `<div class="meta">${lineage.join(' · ')}</div>` : ''}
              </article>`;
          }).join('');
          return `<section class="milestone-phase"><h4>${label}</h4><div class="milestone-list">${itemsHtml}</div></section>`;
        }).filter(Boolean).join('');
        const collapseBtn = `<div class="milestone-actions"><button class="milestone-toggle collapse-btn">${tr('paperhub_milestone_btn_collapse', {}, '收起')}</button></div>`;
        return groups + collapseBtn;
      }

      async function loadMilestone(slug) {
        if (state.milestoneCache.has(slug)) return state.milestoneCache.get(slug);
        const url = `${DATA_BASE}/data/ai/scholarpush/milestones/tasks/${slug}.json`;
        const data = await fetchJSON(url);
        state.milestoneCache.set(slug, data);
        return data;
      }

      function switchTab(target) {
        const tab = target.dataset.tab;
        if (!tab || !panels[tab]) return;
        tabButtons.forEach((btn) => {
          const isActive = btn === target;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', String(isActive));
        });
        Object.entries(panels).forEach(([key, panel]) => {
          const isActive = key === tab;
          panel.classList.toggle('active', isActive);
          panel.hidden = !isActive;
        });
      }

      tabButtons.forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn));
      });

      if (highlightSearch) {
        highlightSearch.addEventListener('input', () => {
          renderHighlights();
        });
      }

      if (milestoneSearch) {
        milestoneSearch.addEventListener('input', () => {
          renderMilestones();
        });
      }

      syncStaticText();

      async function init() {
        if (highlightList) {
          highlightList.innerHTML = `<div class="hub-loading">${tr('paperhub_loading_highlights', {}, '加载今日精选...')}</div>`;
        }
        if (milestoneList) {
          milestoneList.innerHTML = `<div class="hub-loading">${tr('paperhub_loading_milestones', {}, '加载任务索引...')}</div>`;
        }
        state.loadingHighlights = true;
        state.loadingMilestones = true;
        try {
          const [alias, highlights, datesIndex, milestoneIndex] = await Promise.all([
            fetchJSON(TAG_ALIAS_URL).catch(() => []),
            fetchJSON(HIGHLIGHTS_URL).catch(() => ({ items: [] })),
            fetchJSON(DATES_URL).catch(() => ({ dates: [] })),
            fetchJSON(MILESTONE_INDEX_URL).catch(() => ({ tasks: [] }))
          ]);
          state.aliasMap = buildAliasMap(alias);
          // keep index.json items as a fallback but primary per-day loading will be used
          state.highlights = Array.isArray(highlights.items) ? highlights.items : [];
          // available dates list (expect dates.json to be { dates: ['2025-10-06','2025-10-07', ...] })
          // dates.json might be either an array (['2025-10-07', ...]) or an object { dates: [...] }
          let dateList = [];
          if (Array.isArray(datesIndex)) dateList = datesIndex;
          else if (Array.isArray(datesIndex.dates)) dateList = datesIndex.dates;
          state.availableDates = new Set(dateList);
          // Load all highlights from all dates
          state.allHighlights = await loadAllHighlights(dateList);
          state.milestonesIndex = Array.isArray(milestoneIndex.tasks) ? milestoneIndex.tasks : [];
          state.loadingHighlights = false;
          state.loadingMilestones = false;
          state.hasHighlightData = true;
          state.hasMilestoneData = true;
          renderHighlightChips(state.allHighlights);
          // initialize date input to latest date from dates.json (if available) or fallback
          initSelectedDate();
          // Default view: render all highlights on page load.
          renderHighlights();
          renderMilestoneFilters(state.milestonesIndex);
          renderMilestones();
        } catch (error) {
          state.loadingHighlights = false;
          state.loadingMilestones = false;
          state.hasHighlightData = false;
          state.hasMilestoneData = false;
          const message = tr('paperhub_error_load_failed', { error: error.message }, '加载失败：{error}');
          if (highlightList) highlightList.innerHTML = `<div class="hub-error">${message}</div>`;
          if (milestoneList) milestoneList.innerHTML = `<div class="hub-error">${message}</div>`;
        }
      }

      init();

      // --- helper: position the final phase segment-tail precisely ---
      function positionFinalPhaseTail() {
        try {
          // find the last milestone-phase that has a list
          const phases = document.querySelectorAll('.milestone-body .milestone-phase');
          if (!phases || !phases.length) return;
          const last = phases[phases.length - 1];
          if (!last) return;
          const list = last.querySelector('.milestone-list');
          if (!list) return;

          // ensure a tail element exists
          let tail = last.querySelector('.segment-tail');
          if (!tail) {
            tail = document.createElement('div');
            tail.className = 'segment-tail';
            last.appendChild(tail);
          }

          // compute x position: marker center relative to the last element's left
          const marker = last.querySelector('h4::before');
          // since pseudo-element can't be measured, compute from known offsets
          const phaseBefore = getComputedStyle(last).getPropertyValue('--phase-left');

          // compute marker offset used in CSS: desktop 38px, mobile 22px
          const viewport = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          const markerOffset = viewport <= 720 ? 22 : 38;
          const listStyle = getComputedStyle(list);
          const listMarginLeft = parseFloat(listStyle.marginLeft) || 0;

          // position tail so it visually aligns with marker: compute marker center in page coords
          const phaseRect = last.getBoundingClientRect();
          const listRect = list.getBoundingClientRect();
          const h4 = last.querySelector('h4');
          const headingRect = h4 ? h4.getBoundingClientRect() : phaseRect;

          // absolute marker center x relative to phase: heading.left - phase.left + markerOffset
          const markerCenterX = (headingRect.left - phaseRect.left) + markerOffset;
          const tailWidth = parseFloat(getComputedStyle(tail).width) || 3;
          let leftRelativeToPhase = markerCenterX - (tailWidth / 2);
          if (!Number.isFinite(leftRelativeToPhase)) leftRelativeToPhase = markerOffset - listMarginLeft || 38;

          // compute top: start slightly below the visual center of the marker
          const top = (headingRect.top - phaseRect.top) + (headingRect.height / 2) + 8;

          // compute height: from top down to bottom of list
          const bottomOfList = listRect.bottom - phaseRect.top - 12; // breathing room
          let height = Math.max(12, bottomOfList - top);
          if (!Number.isFinite(height) || height < 12) {
            height = Math.max(40, (listRect.height || 120) - 24);
          }

          // commit styles
          tail.style.display = 'block';
          tail.style.left = `${Math.round(leftRelativeToPhase)}px`;
          tail.style.top = `${Math.round(top)}px`;
          tail.style.height = `${Math.round(height)}px`;
        } catch (e) {
          // silently ignore in older browsers
        }
      }

      // run on resize to keep alignment
      let tailResizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(tailResizeTimer);
        tailResizeTimer = setTimeout(positionFinalPhaseTail, 120);
      });

      // run after details are rendered by calling positionFinalPhaseTail from where renderMilestoneDetail()
      window.addEventListener('language-changed', () => {
        syncStaticText();
        if (state.hasHighlightData) {
          renderHighlightChips(state.allHighlights);
        }
        if (state.hasMilestoneData) {
          renderMilestoneFilters(state.milestonesIndex);
        }
        renderHighlights();
        renderMilestones();
      });
    })();
  </script>
</body>
</html>
