<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中华传说：光之卷</title>
    <link rel="stylesheet" href="game.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- 背景层 -->
        <div class="bg-layer"></div>
        
        <!-- 启动屏幕 -->
        <div id="start-screen" class="screen active">
            <div class="title-area">
                <h1 class="main-title">中华传说</h1>
                <h2 class="sub-title">光之卷</h2>
            </div>
            <div class="menu-area">
                <div class="grade-selector">
                    <p>请选择你的境界：</p>
                    <div class="grade-buttons">
                        <button class="grade-btn" data-grade="1">筑基期 (1-2年级)</button>
                        <button class="grade-btn" data-grade="3">结丹期 (3-4年级)</button>
                        <button class="grade-btn" data-grade="5">元婴期 (5-6年级)</button>
                    </div>
                </div>
                <button id="start-btn" class="ink-btn">开启冒险</button>
            </div>
        </div>

        <!-- 地图屏幕 (新增) -->
        <div id="map-screen" class="screen">
            <div class="map-scroll">
                <h2 class="map-title">选择关卡</h2>
                <div class="map-nodes">
                    <!-- 节点由JS生成 -->
                </div>
                <button id="back-to-menu-btn" class="secondary-btn">返回首页</button>
            </div>
        </div>

        <!-- 战斗屏幕 -->
        <div id="battle-screen" class="screen">
            <!-- 顶部状态栏 -->
            <div class="top-bar">
                <div class="player-status">
                    <div class="avatar player-avatar"></div>
                    <div class="bars-container">
                        <div class="bar-wrap">
                            <div class="hp-bar" id="player-hp"></div>
                        </div>
                        <div class="bar-wrap ink-wrap">
                            <div class="ink-bar" id="player-ink"></div>
                        </div>
                    </div>
                    <span id="player-name">御墨师</span>
                </div>
                <div class="stage-info">
                    <span id="stage-name">第一卷 · 初入墨林</span>
                </div>
                <div class="enemy-status">
                    <span id="enemy-name">错别字怪</span>
                    <div class="hp-bar-container">
                        <div class="hp-bar" id="enemy-hp"></div>
                    </div>
                    <div class="avatar enemy-avatar"></div>
                </div>
            </div>

            <!-- 战斗主舞台 -->
            <div class="battle-stage">
                <div class="character player" id="player-char">
                    <div class="effect-container"></div>
                </div>
                <div class="character enemy" id="enemy-char">
                    <div class="effect-container"></div>
                </div>
                <div class="damage-text" id="damage-display"></div>
            </div>

            <!-- 底部操作区 (卷轴样式) -->
            <div class="control-panel">
                <div class="scroll-bg"></div>
                
                <!-- 技能选择阶段 -->
                <div id="skill-menu" class="panel-content active">
                    <button class="skill-card" data-type="attack">
                        <span class="icon">⚔️</span>
                        <span class="name">挥毫 (0墨)</span>
                        <span class="desc">普通攻击，回复10墨</span>
                    </button>
                    <button class="skill-card" data-type="skill">
                        <span class="icon">✨</span>
                        <span class="name">泼墨 (30墨)</span>
                        <span class="desc">必杀一击，伤害翻倍</span>
                    </button>
                    <button class="skill-card" data-type="heal">
                        <span class="icon">💊</span>
                        <span class="name">润笔 (20墨)</span>
                        <span class="desc">恢复生命值</span>
                    </button>
                </div>

                <!-- 答题阶段 -->
                <div id="question-panel" class="panel-content">
                    <div class="question-text" id="q-text">题目加载中...</div>
                    <div class="options-grid" id="q-options">
                        <!-- 选项由JS生成 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 结算屏幕 -->
        <div id="result-screen" class="screen">
            <div class="result-card">
                <h2 id="result-title">战斗胜利！</h2>
                <div class="rewards">
                    <p>获得经验：<span id="exp-gain">100</span></p>
                    <p>解锁新关卡！</p>
                </div>
                <div class="result-buttons">
                    <button id="back-map-btn" class="secondary-btn">返回地图</button>
                    <button id="next-level-btn" class="ink-btn">下一关</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
